{% load static %}
{% block content %}
<div class="login-container">
        <img class="image" src="{% static 'home/img/full-vertical.svg' %}" alt="Logo" height="70">
        <link rel="stylesheet" href="{% static 'home/css/login.css' %}">
        <p class="vorod">ورود | ثبت‌نام</p>
        <p class="matn">سلام!</p>
        <p class="matn1">لطفا شماره موبایل یا ایمیل خود را وارد کنید</p>

        <form method="POST" action="{% url 'register' %}" id="login-form">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="login-button">ورود</button>
        </form>
    </div>

    <script src="{% static 'home/js/validation.js' %}"></script>
{% endblock %}
