{% load static %}
<link href="{% static 'home/css/shop.css' %}" rel="stylesheet" />
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container px-4 px-lg-5 d-flex align-items-center justify-content-between">

        <!-- Logo -->
        <a class="navbar-brand" href="#">
             <img class="image" src="{% static 'home/svg/full-horizontal.svg' %}" alt="Logo" height="40">
        </a>

        <!-- Mobile Toggle Button -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Navbar Links (Collapse for mobile) -->
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'home' %}">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'about' %}">About</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Services</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Contact</a>
                </li>
            </ul>
        </div>

        <!-- Cart and Login -->
        <div class="cart-login d-flex align-items-center">
            <a href="#" class="cart-icon me-3">
                <i class="fas fa-shopping-cart fa-lg"></i>
            </a>

            {% if user.is_authenticated %}
                <a href="{% url 'logout' %}" class="btn btn-outline-dark d-flex align-items-center">
                    <i class="fas fa-sign-out-alt me-2"></i> خروج
                </a>
            {% else %}
            <header class="header">
                <div class="cart-icon">

                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
                    </svg>
                </div>
                <div class="login-section">
                    <svg class="login-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
                    </svg>
                    <a href="{% url 'login' %}" class="login-text">ورود | ثبت‌نام</a>
                </div>
            </header>
            {% endif %}
    </div>
</nav>
