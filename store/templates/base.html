{% load static %}
{% load compress %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="خرید آنلاین با بهترین قیمت و کیفیت در Django Ecommerce" />
        <meta name="author" content="Django Ecommerce" />
        <title>فروشگاه اینترنتی دیجی کالا</title>
        <!-- Favicon -->
        <link rel="icon" type="image/x-icon" href="{% static 'home/img/th.jpeg' %}" style="width: 10px; height: 10px;" />
        <!-- Bootstrap icons -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
        <!-- Core theme CSS (includes Bootstrap) -->
        {% compress css %}
        <link href="{% static 'home/css/styles.css' %}" rel="stylesheet" />
        {% endcompress %}
    </head>
    <body>
        <!-- Navigation -->
        {% include 'home/navbar.html' %}

        <!-- Main Content -->
        <main class="container mt-4">
            {% block content %}{% endblock %}
        </main>

        <!-- Footer -->
        <footer class="py-5 bg-dark text-center text-white">
            <p>تمامی حقوق محفوظ است &copy; Django Ecommerce</p>
        </footer>

        <!-- JavaScript (Bootstrap & Custom Scripts) -->
        {% compress js %}
        <script src="{% static 'home/js/main.js' %}"></script>
        {% endcompress %}
    </body>
</html>
